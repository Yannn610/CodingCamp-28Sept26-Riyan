<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">

    <header class="app-header">
      <div id="balance-display" aria-live="polite">
        <span class="balance-label">Total Spent</span>
        <span id="balance-amount">0.00</span>
      </div>

      <div class="header-controls">
        <!-- Spending limit -->
        <div class="limit-control">
          <label for="budget-limit" class="limit-label">Limit $</label>
          <input
            id="budget-limit"
            type="number"
            min="0"
            step="0.01"
            placeholder="Set budget…"
            aria-label="Spending limit"
          />
        </div>

        <!-- Dark / light toggle -->
        <button
          id="theme-toggle"
          type="button"
          class="btn-icon"
          aria-label="Toggle dark mode"
          title="Toggle dark / light mode"
        >
          <span class="icon-sun" aria-hidden="true">☀️</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <main class="app-main">

      <!-- ── Add Expense ── -->
      <section class="input-section">
        <h2>Add Expense</h2>
        <form id="transaction-form" novalidate>

          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input
              id="item-name"
              type="text"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span class="field-error" id="item-name-error" role="alert"></span>
          </div>

          <div class="field-group">
            <label for="amount">Amount</label>
            <input
              id="amount"
              type="number"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
            />
            <span class="field-error" id="amount-error" role="alert"></span>
          </div>

          <div class="field-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">-- Select --</option>
              <!-- options injected by app.js -->
            </select>
            <span class="field-error" id="category-error" role="alert"></span>
          </div>

          <button type="submit">Add Transaction</button>

        </form>

        <!-- ── Custom Categories ── -->
        <div class="category-manager">
          <h3>Manage Categories</h3>
          <div class="category-add-row">
            <input
              id="new-category-input"
              type="text"
              maxlength="30"
              placeholder="New category name…"
              aria-label="New category name"
            />
            <button id="add-category-btn" type="button" class="btn-secondary">Add</button>
          </div>
          <span class="field-error" id="category-add-error" role="alert"></span>
          <ul id="category-tag-list" aria-label="Custom categories"></ul>
        </div>
      </section>

      <!-- ── Transaction List ── -->
      <section class="list-section">
        <div class="list-header">
          <h2>Transactions</h2>
          <div class="sort-controls" role="group" aria-label="Sort transactions">
            <span class="sort-label">Sort:</span>
            <button type="button" class="btn-sort active" data-sort="date">Date</button>
            <button type="button" class="btn-sort" data-sort="amount">Amount</button>
            <button type="button" class="btn-sort" data-sort="category">Category</button>
          </div>
        </div>
        <div id="transaction-list">
          <!-- rendered by app.js -->
        </div>
      </section>

      <!-- ── Chart ── -->
      <section class="chart-section">
        <h2>Spending by Category</h2>
        <div id="chart-container">
          <canvas id="pie-chart"></canvas>
          <p class="chart-empty" hidden>Add some transactions to see your spending breakdown.</p>
        </div>
      </section>

    </main>

    <div id="storage-warning" hidden>
      ⚠️ LocalStorage is unavailable — data will not be saved this session.
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
